name: CI
on: [push, pull_request]

env:
  PLUGINVAL_SHA256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  CLAP_VALIDATOR_SHA256: 49edadcfb407ea0dd946ce418300e853fbd2660fa4b0d00e4f19ff8eef24ad90

jobs:
  check:
    runs-on: docker
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust, plugin build deps, Python, validators
        run: |
          apt-get update -qq
          apt-get install -y -qq libasound2-dev libgl-dev libjack-jackd2-dev libx11-xcb-dev libxcb1-dev \
            libxcb-dri2-0-dev libxcb-icccm4-dev libxcursor-dev libxkbcommon-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev python3-venv xvfb unzip
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -fsSLo /tmp/pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          curl -fsSLo /tmp/cv.zip https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-ubuntu-22.04.zip
          printf '%s  /tmp/pv.zip\n%s  /tmp/cv.zip\n' "$PLUGINVAL_SHA256" "$CLAP_VALIDATOR_SHA256" | sha256sum -c -
          unzip -q /tmp/pv.zip -d /usr/local/bin && unzip -q /tmp/cv.zip -d /tmp/cv && tar -xzf /tmp/cv/*.tar.gz -C /usr/local/bin
      # Test-only cache, never feeds release builds. Saved only from main (a PR editing this file
      # could still write ci-* keys; worst case is a misleading test run, not a shipped binary).
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Analysis tests (pure math, no plugin rendering)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q numpy scipy pytest # unpinned: runner's Python may be older than requirements.txt's pins need
          /tmp/venv/bin/python -m pytest -q analysis/tests
      - run: cargo xtask bundle sosig_maxxer --release
      # Excluded: nih-plug (upstream, unfixed on master) doesn't send params rescan after state load,
      # and aborts on a garbage state length prefix. Real hosts re-read values after load.
      - run: >-
          clap-validator validate
          -x '^state-reproducibility-(basic|binary|buffered)$' -x '^state-invalid-random$'
          "target/bundled/Sosig Maxxer.clap"
      - run: xvfb-run -a pluginval --strictness-level 8 --validate-in-process --skip-gui-tests "target/bundled/Sosig Maxxer.vst3"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}
