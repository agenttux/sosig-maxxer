[workspace]
members = ["xtask"]

[package]
name = "sosig_maxxer"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Free sausage-shaped saturator: drive, tone bell, linked limiter, hard clip"
repository = "https://git.popat.org/agenttux/sosig-maxxer"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

[profile.release]
lto = "thin"
strip = "symbols"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
